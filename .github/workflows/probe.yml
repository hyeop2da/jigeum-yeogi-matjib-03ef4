name: probe
on:
  push:
    branches: [claude/brave-dirac-29wr5s]
    paths: [".github/workflows/probe.yml","tests/live-probe.js"]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node tests/live-probe.js > out.txt 2>&1 || true
      - run: cat out.txt
