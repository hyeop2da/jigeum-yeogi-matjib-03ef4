name: Probe payment methods (temporary)

on:
  push:
    branches: [gh-pages]
    paths: [".github/workflows/probe-pay.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Payment fields
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36"
          def get(url, h):
              hh = {"User-Agent": UA, "Accept": "application/json"}; hh.update(h)
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers=hh), timeout=20); return r.status, r.read().decode()
              except urllib.error.HTTPError as e: return e.code, e.read().decode()[:300]
          H = {"pf": "web", "appVersion": "6.6.0", "Origin": "https://place.map.kakao.com", "Referer": "https://place.map.kakao.com/"}
          seen = {}
          for q in ["제주시청 맛집", "노형동 맛집", "구좌읍 맛집", "탐나는전 식당", "탐나는점빵"]:
              s, t = get("https://search.map.kakao.com/mapsearch/map.daum?" + urllib.parse.urlencode({"q": q, "page": 1}), {"Referer": "https://map.kakao.com/"})
              rows = json.loads(t).get("place") or []
              print("=== 검색:", q, "→", len(rows), "곳 | 첫 3곳:", [(r.get("name"), r.get("cate_name_depth2")) for r in rows[:3]])
              for r in rows[:6]:
                  pid = str(r.get("confirmid"))
                  if pid in seen: continue
                  s, t = get(f"https://place-api.map.kakao.com/places/panel3/{pid}", H)
                  try: d = json.loads(t)
                  except Exception: continue
                  pay = (d.get("summary") or {}).get("payments")
                  seen[pid] = 1
                  print(f"  {r.get('name')} | pay_keywords_disp={r.get('pay_keywords_disp')} | summary.payments={json.dumps(pay, ensure_ascii=False)[:300]}")
          PY
