name: Probe 메가커피 (temporary)

on:
  push:
    branches: [gh-pages]
    paths: [".github/workflows/probe-mega.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare two branches
        run: |
          python3 - <<'PY'
          import json, re, math, urllib.request, urllib.parse
          cfg = open("config.js").read()
          JS = re.search(r"KAKAO_JS_KEY:\s*'([^']+)'", cfg).group(1)
          PROXY = re.search(r"KAKAO_PROXY_URL:\s*'([^']+)'", cfg).group(1)
          O = "https://hyeop2da.github.io"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36"
          def get(url, h=None):
              hh = {"User-Agent": UA, "Accept": "application/json"}; hh.update(h or {})
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers=hh), timeout=20); return r.status, r.read().decode()
              except urllib.error.HTTPError as e: return e.code, e.read().decode()[:300]
          sdk = {"Authorization": "KakaoAK " + JS, "KA": "sdk/4.4.19 os/javascript lang/ko-KR device/Win32 origin/" + urllib.parse.quote(O), "Origin": O, "Referer": O + "/"}
          def hv(a, b):
              R = 6371000; t = math.pi / 180
              h = math.sin((b[1]-a[1])*t/2)**2 + math.cos(a[1]*t)*math.cos(b[1]*t)*math.sin((b[0]-a[0])*t/2)**2
              return 2*R*math.asin(math.sqrt(h))
          s, t = get("https://dapi.kakao.com/v2/local/search/address.json?" + urllib.parse.urlencode({"query": "제주 과원로 27"}), sdk)
          d = json.loads(t)["documents"][0]; home = (float(d["x"]), float(d["y"])); print("집:", d["address_name"], home)
          s, t = get("https://dapi.kakao.com/v2/local/search/keyword.json?" + urllib.parse.urlencode({"query": "메가커피", "x": home[0], "y": home[1], "radius": 3000, "sort": "distance"}), sdk)
          megas = json.loads(t)["documents"]
          for m in megas[:6]:
              q = urllib.parse.urlencode({"id": m["id"], "name": m["place_name"], "addr": m.get("road_address_name") or "", "x": m["x"], "y": m["y"], "v": "probe3"})
              s2, t2 = get(PROXY + "?" + q, {"Origin": O}); r = json.loads(t2)
              print(f"{m['place_name']} | {m['category_group_code']} {m['category_name']} | 거리 {m['distance']}m | 평점 {r.get('rating')} ({r.get('ratingCount')}명) 블로그 {r.get('reviewCount')} | {m.get('road_address_name')}")
          for label, kind, q in [("keyword 카페", "keyword", {"query": "카페"}), ("category CE7", "category", {"category_group_code": "CE7"}), ("keyword 빵집", "keyword", {"query": "빵집"})]:
              allr = []
              for page in (1, 2, 3):
                  qq = dict(q, x=home[0], y=home[1], radius=1000, sort="distance", size=15, page=page)
                  s, t = get("https://dapi.kakao.com/v2/local/search/" + kind + ".json?" + urllib.parse.urlencode(qq), sdk)
                  dd = json.loads(t); allr += dd.get("documents", []); total = dd.get("meta", {}).get("total_count")
                  if dd.get("meta", {}).get("is_end"): break
              far = max(int(x["distance"]) for x in allr) if allr else 0
              print(f"{label}: 1km 안 전체 {total}곳, 받은 {len(allr)}곳 (가장 먼 곳 {far}m) | 메가 포함:", [x["place_name"] for x in allr if "메가" in x["place_name"]])
          PY
