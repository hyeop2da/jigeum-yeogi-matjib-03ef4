name: Deploy Kakao Ratings Worker

on:
  push:
    branches:
      - gh-pages
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-worker
  cancel-in-progress: false

env:
  WORKER_NAME: jigeum-yeogi-kakao-ratings
  CF_API: https://api.cloudflare.com/client/v4

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanitize and verify Cloudflare credentials
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # 공백/줄바꿈/따옴표/"Bearer " 접두어 제거 (토큰 값은 절대 출력하지 않음)
          TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]"'"'" | sed -E 's/^[Bb]earer//')
          ACCOUNT_ID=$(printf '%s' "$RAW_ACCOUNT_ID" | tr -d '[:space:]"'"'")
          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN Secret 이 비어 있습니다."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "Token length after sanitize: ${#TOKEN}"

          VERIFIED=""
          if curl -fsS -H "Authorization: Bearer $TOKEN" "$CF_API/user/tokens/verify" -o /tmp/verify-user.json; then
            VERIFIED="user"
          fi

          if [ -z "$ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_ACCOUNT_ID Secret 이 비어 있어 /accounts 에서 조회합니다."
            ACCOUNT_ID=$(curl -fsS -H "Authorization: Bearer $TOKEN" "$CF_API/accounts" \
              | python3 -c "import json,sys; r=json.load(sys.stdin).get('result') or []; print(r[0]['id'] if r else '')" || true)
          fi
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::Cloudflare Account ID 를 확인할 수 없습니다. CLOUDFLARE_ACCOUNT_ID Secret 을 설정하세요."
            exit 1
          fi
          echo "Account ID length: ${#ACCOUNT_ID}"

          if [ -z "$VERIFIED" ] && curl -fsS -H "Authorization: Bearer $TOKEN" \
               "$CF_API/accounts/$ACCOUNT_ID/tokens/verify" -o /tmp/verify-account.json; then
            VERIFIED="account"
          fi
          if [ -z "$VERIFIED" ]; then
            echo "::error::Cloudflare API 토큰 검증 실패. 'Edit Cloudflare Workers' 템플릿으로 만든 토큰 값만 Secret 에 넣었는지 확인하세요."
            exit 1
          fi
          echo "Token verified via /$VERIFIED tokens/verify endpoint."

          {
            echo "CLOUDFLARE_API_TOKEN=$TOKEN"
            echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID"
          } >> "$GITHUB_ENV"

      - name: Deploy Worker
        id: deploy
        working-directory: worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.toml 2>&1 | tee /tmp/deploy.log
          URL=$(grep -oE "https://${WORKER_NAME}\.[a-z0-9-]+\.workers\.dev" /tmp/deploy.log | head -n1 || true)
          if [ -z "$URL" ]; then
            echo "배포 출력에서 URL 을 찾지 못해 API 로 workers.dev 서브도메인을 조회합니다."
            SUBDOMAIN=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              | python3 -c "import json,sys; print((json.load(sys.stdin).get('result') or {}).get('subdomain') or '')" || true)
            if [ -z "$SUBDOMAIN" ]; then
              echo "::error::workers.dev 서브도메인이 없습니다. Cloudflare 대시보드 Workers & Pages 에서 서브도메인을 먼저 등록하세요."
              exit 1
            fi
            URL="https://${WORKER_NAME}.${SUBDOMAIN}.workers.dev"
          fi
          echo "Worker URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test Worker
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          ORIGIN="https://hyeop2da.github.io"
          ok=""
          for i in $(seq 1 12); do
            if curl -fsS -H "Origin: $ORIGIN" "$WORKER_URL" -o /tmp/get.json; then ok=1; break; fi
            echo "GET 재시도 $i/12 (workers.dev 전파 대기)"; sleep 5
          done
          [ -n "$ok" ] || { echo "::error::GET 헬스체크 실패"; exit 1; }
          echo "GET: $(cat /tmp/get.json)"
          grep -q '"ok":true' /tmp/get.json

          curl -fsS -o /dev/null -D /tmp/options.h -X OPTIONS \
            -H "Origin: $ORIGIN" -H "Access-Control-Request-Method: POST" "$WORKER_URL"
          echo "OPTIONS headers:"; cat /tmp/options.h
          grep -qi "access-control-allow-origin: $ORIGIN" /tmp/options.h

          curl -fsS -X POST -H "Origin: $ORIGIN" -H "Content-Type: text/plain;charset=UTF-8" \
            --data '{"places":[{"id":"11547525","place_name":"우진해장국","road_address_name":"제주특별자치도 제주시 서사로 11","x":"126.52000128","y":"33.5115169"}]}' \
            "$WORKER_URL" -o /tmp/post.json
          echo "POST: $(cat /tmp/post.json)"
          python3 - <<'PY'
          import json, sys
          d = json.load(open("/tmp/post.json"))
          p = (d.get("places") or [{}])[0]
          if p.get("rating") is None:
              print("::error::우진해장국 평점이 null 입니다. diagnostics:", json.dumps(d.get("diagnostics"), ensure_ascii=False))
              sys.exit(1)
          print(f"우진해장국 rating={p['rating']} reviewCount={p.get('reviewCount')}")
          PY

      - name: Update config.js
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("config.js")
          s = p.read_text(encoding="utf-8")
          new, n = re.subn(r"KAKAO_PROXY_URL:\s*(['\"]).*?\1",
                           "KAKAO_PROXY_URL: '" + os.environ["WORKER_URL"] + "'", s)
          if n != 1:
              raise SystemExit("config.js 에서 KAKAO_PROXY_URL 을 찾지 못했습니다.")
          p.write_text(new, encoding="utf-8")
          PY
          cat config.js

      - name: Commit config if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- config.js; then
            echo "config.js already points to the deployed Worker."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.js
          git commit -m "chore: point Kakao ratings proxy to Cloudflare Worker"
          BRANCH="${GITHUB_REF_NAME}"
          for i in 1 2 3; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            sleep $((i * 3))
          done
          echo "::error::config.js push 실패"
          exit 1
