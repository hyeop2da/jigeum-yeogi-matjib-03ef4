name: Deploy Kakao Ratings Worker

on:
  push:
    branches:
      - gh-pages
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID GitHub Secrets가 없습니다."
            exit 1
          fi
          npx --yes wrangler@latest deploy --config wrangler.toml

      - name: Resolve Worker URL
        id: worker-url
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SUBDOMAIN=$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | python -c "import json,sys; print(json.load(sys.stdin)['result']['subdomain'])")
          echo "url=https://jigeum-yeogi-kakao-ratings.$SUBDOMAIN.workers.dev" >> "$GITHUB_OUTPUT"

      - name: Update GitHub Pages config
        env:
          WORKER_URL: ${{ steps.worker-url.outputs.url }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          p = Path("config.js")
          s = p.read_text(encoding="utf-8")
          url = os.environ["WORKER_URL"]
          s = s.replace(
              "KAKAO_PROXY_URL: 'https://ubiquitous-meerkat-e953f4.netlify.app/api/kakao-ratings'",
              "KAKAO_PROXY_URL: '" + url + "'"
          )
          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit config if changed
        run: |
          if git diff --quiet -- config.js; then
            echo "config.js already points to the deployed Worker."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.js
          git commit -m "chore: point Kakao ratings proxy to Cloudflare Worker"
          git push origin gh-pages
