name: Probe Kakao opening hours (temporary)

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths: [".github/workflows/probe-hours.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Look for opening-hours fields
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36"
          def get(url, headers=None):
              h = {"User-Agent": UA, "Referer": "https://map.kakao.com/", "Accept": "application/json, text/plain, */*"}
              h.update(headers or {})
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=20)
                  return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")[:300]
              except Exception as e:
                  return None, str(e)
          def hourish(obj, path=""):
              out = []
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      p = f"{path}.{k}"
                      if any(w in k.lower() for w in ("hour", "open", "time", "biz", "holiday", "close", "break")):
                          out.append((p, json.dumps(v, ensure_ascii=False)[:400]))
                      out += hourish(v, p)
              elif isinstance(obj, list):
                  for i, v in enumerate(obj[:3]):
                      out += hourish(v, f"{path}[{i}]")
              return out
          for pid, name in [("11547525", "우진해장국")]:
              print("=== 1) mapsearch row ===")
              s, t = get("https://search.map.kakao.com/mapsearch/map.daum?" + urllib.parse.urlencode({"q": name, "page": 1}))
              print("status", s)
              try:
                  rows = json.loads(t).get("place") or []
                  row = next((r for r in rows if str(r.get("confirmid")) == pid), rows[0] if rows else {})
                  print("keys:", sorted(row.keys()))
                  for p, v in hourish(row): print("  ", p, "=", v)
              except Exception as e:
                  print("parse fail", e, t[:200])
              for label, url, hdr in [
                  ("2) place main/v", f"https://place.map.kakao.com/main/v/{pid}", {}),
                  ("3) place-api panel3", f"https://place-api.map.kakao.com/places/panel3/{pid}", {"pf": "web", "appVersion": "6.6.0", "Origin": "https://place.map.kakao.com", "Referer": "https://place.map.kakao.com/"}),
              ]:
                  print("===", label, "===")
                  s, t = get(url, hdr)
                  print("status", s, "len", len(t))
                  try:
                      d = json.loads(t)
                      print("top keys:", sorted(d.keys())[:40] if isinstance(d, dict) else type(d))
                      for p, v in hourish(d)[:25]: print("  ", p, "=", v)
                  except Exception:
                      print("not json:", t[:200])
          PY
