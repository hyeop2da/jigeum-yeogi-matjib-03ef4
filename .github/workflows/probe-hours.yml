name: Probe Kakao opening hours (temporary)

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths: [".github/workflows/probe-hours.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Look for opening-hours fields
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36"
          def get(url, headers=None):
              h = {"User-Agent": UA, "Referer": "https://map.kakao.com/", "Accept": "application/json, text/plain, */*"}
              h.update(headers or {})
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=20)
                  return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")[:300]
              except Exception as e:
                  return None, str(e)
          def hourish(obj, path=""):
              out = []
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      p = f"{path}.{k}"
                      if any(w in k.lower() for w in ("hour", "open", "time", "biz", "holiday", "close", "break")):
                          out.append((p, json.dumps(v, ensure_ascii=False)[:400]))
                      out += hourish(v, p)
              elif isinstance(obj, list):
                  for i, v in enumerate(obj[:3]):
                      out += hourish(v, f"{path}[{i}]")
              return out
          s, t = get("https://search.map.kakao.com/mapsearch/map.daum?" + urllib.parse.urlencode({"q": "제주시 노형동 맛집", "page": 1}))
          ids = [str(r.get("confirmid")) for r in (json.loads(t).get("place") or [])][:6] + ["11547525"]
          H = {"pf": "web", "appVersion": "6.6.0", "Origin": "https://place.map.kakao.com", "Referer": "https://place.map.kakao.com/"}
          for pid in ids:
              s, t = get(f"https://place-api.map.kakao.com/places/panel3/{pid}", H)
              try:
                  d = json.loads(t)
                  name = (d.get("summary") or {}).get("name")
                  print("=====", pid, name, "status", s)
                  print(json.dumps(d.get("open_hours"), ensure_ascii=False)[:2500])
              except Exception as e:
                  print("=====", pid, "status", s, "fail", t[:200])
          PY
