name: Probe 카멜커피 (temporary)

on:
  push:
    branches: [gh-pages]
    paths: [".github/workflows/probe-camel.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Why is 카멜커피 제주점 missing?
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.parse
          cfg = open("config.js").read()
          JS = re.search(r"KAKAO_JS_KEY:\s*'([^']+)'", cfg).group(1)
          PROXY = re.search(r"KAKAO_PROXY_URL:\s*'([^']+)'", cfg).group(1)
          O = "https://hyeop2da.github.io"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36"
          def get(url, h=None):
              hh = {"User-Agent": UA, "Accept": "application/json"}; hh.update(h or {})
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers=hh), timeout=20); return r.status, r.read().decode()
              except urllib.error.HTTPError as e: return e.code, e.read().decode()[:300]
          s, t = get("https://search.map.kakao.com/mapsearch/map.daum?" + urllib.parse.urlencode({"q": "카멜커피 제주점", "page": 1}), {"Referer": "https://map.kakao.com/"})
          rows = json.loads(t).get("place") or []
          for r in rows[:3]:
              print("mapsearch:", r.get("confirmid"), r.get("name"), "|", r.get("cate_name_depth1"), ">", r.get("cate_name_depth2"), ">", r.get("cate_name_depth3"), "| rating", r.get("rating_average"), r.get("rating_count"), "| blog", r.get("reviewCount"), "|", r.get("new_address") or r.get("address"), r.get("lat"), r.get("lon"))
          row = rows[0]; pid = str(row["confirmid"]); lat, lon = float(row["lat"]), float(row["lon"])
          sdk = {"Authorization": "KakaoAK " + JS, "KA": "sdk/4.4.19 os/javascript lang/ko-KR device/Win32 origin/" + urllib.parse.quote(O), "Origin": O, "Referer": O + "/"}
          s, t = get("https://dapi.kakao.com/v2/local/search/keyword.json?" + urllib.parse.urlencode({"query": row["name"], "x": lon, "y": lat, "radius": 500}), sdk)
          d = [x for x in json.loads(t).get("documents", []) if x.get("id") == pid]
          print("local API doc:", json.dumps(d[0], ensure_ascii=False) if d else ("none", s, t[:200]))
          for label, kind, q in [("keyword 카페 1km", "keyword", {"query": "카페"}), ("category CE7 1km", "category", {"category_group_code": "CE7"}), ("category FD6 1km", "category", {"category_group_code": "FD6"}), ("keyword 음식점 1km", "keyword", {"query": "음식점"})]:
              allr = []
              for page in (1, 2, 3):
                  qq = dict(q, x=lon, y=lat, radius=1000, sort="distance", size=15, page=page)
                  s, t = get("https://dapi.kakao.com/v2/local/search/" + kind + ".json?" + urllib.parse.urlencode(qq), sdk)
                  dd = json.loads(t); allr += dd.get("documents", [])
                  if dd.get("meta", {}).get("is_end"): break
              print(label, len(allr), "포함:", any(x.get("id") == pid for x in allr))
          s, t = get(PROXY + "?" + urllib.parse.urlencode({"id": pid, "name": row["name"], "addr": row.get("new_address") or "", "x": lon, "y": lat, "v": "probe2"}), {"Origin": O})
          print("relay:", s, t[:400])
          PY
