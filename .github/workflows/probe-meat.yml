name: Probe meat results (temporary)

on:
  push:
    branches: [gh-pages]
    paths: [".github/workflows/probe-meat.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Meat places near 도청
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.parse
          cfg = open("config.js").read()
          JS = re.search(r"KAKAO_JS_KEY:\s*'([^']+)'", cfg).group(1)
          PROXY = re.search(r"KAKAO_PROXY_URL:\s*'([^']+)'", cfg).group(1)
          O = "https://hyeop2da.github.io"
          sdk = {"Authorization": "KakaoAK " + JS, "KA": "sdk/4.4.19 os/javascript lang/ko-KR device/Win32 origin/" + urllib.parse.quote(O), "Origin": O, "Referer": O + "/", "User-Agent": "Mozilla/5.0"}
          X, Y = 126.49836, 33.48892
          MEAT = re.compile(r"육류|고기|구이|곱창|막창|갈비|삼겹|오겹|돼지|흑돼지|소고기|한우|양꼬치|근고기")
          CHICK = re.compile(r"치킨|닭|오리|삼계탕|백숙")
          def local(kind, q, radius):
              out = []
              for page in (1, 2, 3):
                  qq = dict(q, x=X, y=Y, radius=radius, sort="distance", size=15, page=page)
                  d = json.load(urllib.request.urlopen(urllib.request.Request("https://dapi.kakao.com/v2/local/search/" + kind + ".json?" + urllib.parse.urlencode(qq), headers=sdk)))
                  out += d["documents"]; total = d["meta"]["total_count"]
                  if d["meta"]["is_end"]: break
              return out, total
          allmeat = {}
          for label, kind, q in [("keyword 고기", "keyword", {"query": "고기"}), ("category FD6", "category", {"category_group_code": "FD6"}), ("keyword 고기구이", "keyword", {"query": "고기구이"}), ("keyword 삼겹살", "keyword", {"query": "삼겹살"}), ("keyword 흑돼지", "keyword", {"query": "흑돼지"}), ("keyword 갈비", "keyword", {"query": "갈비"})]:
              rows, total = local(kind, q, 1000)
              meat = [r for r in rows if MEAT.search(r["category_name"] + " " + r["place_name"]) and not CHICK.search(r["category_name"] + " " + r["place_name"]) and r["category_name"].startswith("음식점")]
              for r in meat: allmeat[r["id"]] = r
              far = max((int(r["distance"]) for r in rows), default=0)
              print(f"{label}: 1km 전체 {total}곳 중 받은 {len(rows)}곳(최대 {far}m) → 고기집 {len(meat)}곳")
          print("합치면 고기집", len(allmeat), "곳")
          rated = 0; low = 0; none = 0
          for r in list(allmeat.values())[:60]:
              q = urllib.parse.urlencode({"id": r["id"], "name": r["place_name"], "addr": r.get("road_address_name") or "", "x": r["x"], "y": r["y"], "v": "probe4"})
              d = json.load(urllib.request.urlopen(urllib.request.Request(PROXY + "?" + q, headers={"Origin": O})))
              if d.get("rating") is None: none += 1
              elif d["rating"] >= 3.7: rated += 1
              else: low += 1
          print(f"평점 3.7 이상 {rated} · 3.7 미만 {low} · 평점 없음 {none}")
          PY
