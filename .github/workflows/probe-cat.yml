name: Probe categories (temporary) v2
on:
  push:
    branches: [gh-pages]
    paths: [".github/workflows/probe-cat.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect places
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.parse
          from concurrent.futures import ThreadPoolExecutor
          cfg = open("config.js").read()
          JS = re.search(r"KAKAO_JS_KEY:\s*'([^']+)'", cfg).group(1)
          O = "https://hyeop2da.github.io"
          sdk = {"Authorization": "KakaoAK " + JS, "KA": "sdk/4.4.19 os/javascript lang/ko-KR device/Win32 origin/" + urllib.parse.quote(O), "Origin": O, "Referer": O + "/", "User-Agent": "Mozilla/5.0"}
          LOCS = [(33.4889,126.4984),(33.4996,126.5312),(33.4846,126.4800),(33.2496,126.5620),(33.5430,126.6690),(33.4630,126.3310),(33.5130,126.5270)]
          QS = ["FD6","CE7","한식","국밥","중식","일식","양식","분식","카페","해장국","고기","흑돼지","횟집","족발","치킨","전골","술집","삼겹살","갈비","닭요리","초밥","빵집","국수","보쌈","회","몸국","돈까스","냉면","곱창","샤브샤브","한정식","갈치","고기국수","닭갈비"]
          def job(arg):
              (y, x), q = arg; out = []
              for page in (1, 2, 3):
                  path, qq = ("category", {"category_group_code": q}) if q in ("FD6","CE7") else ("keyword", {"query": q})
                  try:
                      d = json.load(urllib.request.urlopen(urllib.request.Request("https://dapi.kakao.com/v2/local/search/" + path + ".json?" + urllib.parse.urlencode(dict(qq, x=x, y=y, radius=1500, sort="distance", size=15, page=page)), headers=sdk), timeout=15))
                  except Exception: break
                  out += d["documents"]
                  if d["meta"]["is_end"]: break
              return out
          seen = {}
          with ThreadPoolExecutor(8) as ex:
              for rows in ex.map(job, [(l, q) for l in LOCS for q in QS]):
                  for r in rows: seen[r["id"]] = {"place_name": r["place_name"], "category_name": r["category_name"], "category_group_code": r.get("category_group_code", "")}
          json.dump(list(seen.values()), open("/tmp/rows.json", "w"), ensure_ascii=False)
          print("TOTAL", len(seen))
          PY
      - name: Analyze with app rules
        run: |
          cat > /tmp/analyze.js <<'JS'
          // 실제 카카오 가게 목록(rows.json)에 앱의 칩 규칙을 그대로 돌려, 의심스러운 분류를 뽑는다
          const fs=require('fs');
          const html=fs.readFileSync(process.argv[2],'utf8');
          const a=html.indexOf('  const FOODS_LUNCH=['), b=html.indexOf('function textOf');
          const b2=html.indexOf('\n',b);
          const pre=html.slice(html.indexOf('const EXTRA_Q'),html.indexOf('const MIN_RATING'));
          const src=pre+html.slice(a,b2)+'\nreturn {FOODS_LUNCH,FOODS_DINNER,isRestaurant,isCafe,isBar,isEatery,isSoupPlace,isChicken,textOf,foodLabelOf:(p)=>{FOODS=FOODS_LUNCH;return foodLabelOf(p)}};';
          const env=new Function('state','kakao','document','window',src)({},{},{},{});
          const rows=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));
          const last=c=>String(c).split('>').map(s=>s.trim()).slice(1).join('>');
          for(const [meal,list] of [['점심',env.FOODS_LUNCH],['저녁',env.FOODS_DINNER]]){
            for(const [key,label,,test] of list.slice(1)){
              const hit=rows.filter(p=>env.isEatery(p)&&(env.isRestaurant(p)||env.isCafe(p))&&test(p));
              const byCat={};
              hit.forEach(p=>{const k=last(p.category_name);(byCat[k]=byCat[k]||[]).push(p.place_name);});
              // 카테고리만으로는 안 맞고 이름 때문에 들어온 곳
              const byName=hit.filter(p=>!test(Object.assign({},p,{place_name:''})));
              console.log(`\n## ${meal} ${label} : ${hit.length}곳`);
              Object.entries(byCat).sort((x,y)=>y[1].length-x[1].length).forEach(([k,v])=>console.log(`  [${v.length}] ${k} — ${v.slice(0,4).join(', ')}`));
              if(byName.length) console.log('  ▶ 이름 때문에 들어온 곳: '+byName.slice(0,25).map(p=>p.place_name+'('+last(p.category_name)+')').join(', '));
            }
          }
          JS
          node /tmp/analyze.js index.html /tmp/rows.json | head -c 60000
