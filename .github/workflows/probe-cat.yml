name: Probe categories (temporary)
on:
  push:
    branches: [gh-pages]
    paths: [".github/workflows/probe-cat.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.parse
          cfg = open("config.js").read()
          JS = re.search(r"KAKAO_JS_KEY:\s*'([^']+)'", cfg).group(1)
          O = "https://hyeop2da.github.io"
          sdk = {"Authorization": "KakaoAK " + JS, "KA": "sdk/4.4.19 os/javascript lang/ko-KR device/Win32 origin/" + urllib.parse.quote(O), "Origin": O, "Referer": O + "/", "User-Agent": "Mozilla/5.0"}
          LOCS = [(33.4889,126.4984),(33.4996,126.5312),(33.4846,126.4800),(33.2496,126.5620),(33.5430,126.6690),(33.4630,126.3310),(33.5130,126.5270)]
          QS = ["FD6","CE7","한식","국밥","중식","일식","양식","분식","카페","해장국","고기","흑돼지","횟집","족발","치킨","전골","술집","삼겹살","갈비","닭요리","초밥","빵집","국수","보쌈","회","몸국","돈까스","냉면","곱창","샤브샤브","한정식","갈치","고기국수","닭갈비"]
          seen = {}
          for (y, x) in LOCS:
              for q in QS:
                  for page in (1, 2, 3):
                      if q in ("FD6", "CE7"):
                          path, qq = "category", {"category_group_code": q}
                      else:
                          path, qq = "keyword", {"query": q}
                      try:
                          d = json.load(urllib.request.urlopen(urllib.request.Request("https://dapi.kakao.com/v2/local/search/" + path + ".json?" + urllib.parse.urlencode(dict(qq, x=x, y=y, radius=1500, sort="distance", size=15, page=page)), headers=sdk), timeout=15))
                      except Exception as e:
                          break
                      for r in d["documents"]:
                          seen.setdefault(r["id"], (r["place_name"], r["category_name"], r.get("category_group_code", ""), set()))[3].add(q)
                      if d["meta"]["is_end"]: break
          print("TOTAL", len(seen))
          for i, (n, c, g, qs) in seen.items():
              print("ROW\t" + i + "\t" + n + "\t" + c + "\t" + g + "\t" + ",".join(sorted(qs)))
          PY
