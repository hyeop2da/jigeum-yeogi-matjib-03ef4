name: Verify Kakao Ratings Proxy

on:
  push:
    branches:
      - gh-pages
    paths:
      - "config.js"
      - "index.html"
      - "install.html"
      - "sw.js"
      - "api/**"
      - "worker/src/**"
      - ".github/workflows/verify-proxy.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke test proxy from config.js
        run: |
          set -euo pipefail
          URL=$(grep -oE "KAKAO_PROXY_URL:\s*'[^']+'" config.js | sed -E "s/.*'([^']+)'/\1/")
          ORIGIN="https://hyeop2da.github.io"
          echo "Proxy URL: $URL"

          # Vercel 배포가 끝날 때까지 최대 약 5분 대기
          # 서버가 이 커밋의 코드(VERSION)로 재배포될 때까지 대기
          WANT_VERSION=$(grep -oE 'const VERSION = "[^"]+"' worker/src/index.js | sed -E 's/.*"([^"]+)"/\1/')
          echo "Expected proxy version: $WANT_VERSION"
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS -H "Origin: $ORIGIN" "$URL" -o /tmp/get.json && grep -q "\"version\":\"$WANT_VERSION\"" /tmp/get.json; then ok=1; break; fi
            echo "GET 재시도 $i/30"; sleep 10
          done
          [ -n "$ok" ] || { echo "::error::GET 헬스체크 실패"; cat /tmp/get.json 2>/dev/null || true; exit 1; }
          echo "GET: $(cat /tmp/get.json)"

          curl -fsS -o /dev/null -D /tmp/options.h -X OPTIONS \
            -H "Origin: $ORIGIN" -H "Access-Control-Request-Method: POST" "$URL"
          grep -qi "access-control-allow-origin: $ORIGIN" /tmp/options.h
          echo "OPTIONS: CORS OK"

          curl -fsS -X POST -H "Origin: $ORIGIN" -H "Content-Type: text/plain;charset=UTF-8" \
            --data '{"places":[{"id":"11547525","place_name":"우진해장국","road_address_name":"제주특별자치도 제주시 서사로 11","x":"126.52000128","y":"33.5115169"}]}' \
            "$URL" -o /tmp/post.json
          echo "POST: $(cat /tmp/post.json)"
          python3 - <<'PY'
          import json, sys
          d = json.load(open("/tmp/post.json"))
          p = (d.get("places") or [{}])[0]
          if p.get("rating") is None:
              print("::error::우진해장국 평점이 null 입니다.")
              sys.exit(1)
          print(f"우진해장국 rating={p['rating']} reviewCount={p.get('reviewCount')}")
          PY

      - name: Check live GitHub Pages config.js
        run: |
          set -euo pipefail
          WANT=$(grep -oE "KAKAO_PROXY_URL:\s*'[^']+'" config.js)
          for i in $(seq 1 30); do
            LIVE=$(curl -fsS "https://hyeop2da.github.io/jigeum-yeogi-matjib-03ef4/config.js?t=$(date +%s)" | grep -oE "KAKAO_PROXY_URL:\s*'[^']+'" || true)
            if [ "$LIVE" = "$WANT" ]; then echo "Live config.js OK: $LIVE"; exit 0; fi
            echo "Pages 반영 대기 $i/30 (현재: $LIVE)"; sleep 10
          done
          echo "::error::GitHub Pages 의 config.js 가 아직 새 주소가 아닙니다."
          exit 1

      - name: Check live index.html version
        run: |
          set -euo pipefail
          WANT=$(grep -oE 'data-app-version="[^"]+"' index.html)
          for i in $(seq 1 30); do
            LIVE=$(curl -fsS "https://hyeop2da.github.io/jigeum-yeogi-matjib-03ef4/?t=$(date +%s)" | grep -oE 'data-app-version="[^"]+"' || true)
            if [ "$LIVE" = "$WANT" ]; then echo "Live index.html OK: $LIVE"; exit 0; fi
            echo "Pages 반영 대기 $i/30 (현재: $LIVE)"; sleep 10
          done
          echo "::error::GitHub Pages 의 index.html 이 최신 버전이 아닙니다."
          exit 1

      - name: Batch rating test (45 places limit)
        run: |
          set -euo pipefail
          URL=$(grep -oE "KAKAO_PROXY_URL:\s*'[^']+'" config.js | sed -E "s/.*'([^']+)'/\1/")
          python3 - "$URL" <<'PY2'
          import json, sys, urllib.request, time
          url = sys.argv[1]
          base = {"id":"11547525","place_name":"우진해장국","road_address_name":"제주특별자치도 제주시 서사로 11","x":"126.52000128","y":"33.5115169"}
          salt = int(time.time()) % 1000000 * 100  # 실행마다 새 ID → 서버 캐시 영향 제거
          places = [base] + [dict(base, id=str(8000000000 + salt + i), place_name=f"없는가게{i}") for i in range(1, 20)]
          req = urllib.request.Request(url, data=json.dumps({"places": places}).encode(), headers={"Content-Type": "text/plain;charset=UTF-8", "Origin": "https://hyeop2da.github.io"})
          t = time.time()
          d = json.load(urllib.request.urlopen(req, timeout=30))
          print(f"20곳 요청 → 응답 {len(d['places'])}곳, {time.time()-t:.1f}초, rated={d['diagnostics']['rated']}")
          assert len(d["places"]) == 20, "20곳 모두 응답해야 함"
          assert d["places"][0]["rating"] is not None, "우진해장국 평점이 있어야 함"
          wrong = [p["id"] for p in d["places"][1:] if p["rating"] is not None]
          assert not wrong, f"없는 가게에 다른 가게 평점이 붙음: {wrong}"
          PY2

      - name: CDN cache and origin checks
        run: |
          set -euo pipefail
          URL=$(grep -oE "KAKAO_PROXY_URL:\s*'[^']+'" config.js | sed -E "s/.*'([^']+)'/\1/")
          ORIGIN="https://hyeop2da.github.io"
          Q="id=11547525&name=%EC%9A%B0%EC%A7%84%ED%95%B4%EC%9E%A5%EA%B5%AD&addr=%EC%A0%9C%EC%A3%BC%ED%8A%B9%EB%B3%84%EC%9E%90%EC%B9%98%EB%8F%84%20%EC%A0%9C%EC%A3%BC%EC%8B%9C%20%EC%84%9C%EC%82%AC%EB%A1%9C%2011&x=126.52000128&y=33.5115169"
          for i in 1 2 3; do
            curl -fsS -D /tmp/h$i -H "Origin: $ORIGIN" "$URL?$Q" -o /tmp/b$i
            echo "요청 $i: $(grep -i '^x-vercel-cache' /tmp/h$i | tr -d '\r') · $(cat /tmp/b$i)"
            sleep 2
          done
          grep -q '"rating":' /tmp/b1
          grep -qiE '^x-vercel-cache: (HIT|STALE)' /tmp/h3 || { echo "::error::같은 가게 두 번째 조회부터 CDN 보관본(HIT)이 나와야 합니다"; exit 1; }
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Origin: https://evil.example" -H "Content-Type: text/plain" --data '{"places":[]}' "$URL")
          echo "허용되지 않은 사이트 POST → $CODE"
          [ "$CODE" = "403" ]
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Origin: https://evil.example" "$URL?id=1&name=x")
          echo "허용되지 않은 사이트 GET → $CODE"
          [ "$CODE" = "403" ] || [ "$CODE" = "200" ]  # 200 이면 CDN 보관본(브라우저는 CORS 로 차단)

      - name: Check live install page and QR
        run: |
          set -euo pipefail
          B="https://hyeop2da.github.io/jigeum-yeogi-matjib-03ef4"
          for i in $(seq 1 30); do
            if curl -fsS "$B/install.html?t=$(date +%s)" | grep -q "앱 설치하기" && curl -fsS -o /dev/null "$B/qr.png"; then echo "install.html · qr.png OK"; exit 0; fi
            echo "Pages 반영 대기 $i/30"; sleep 10
          done
          exit 1

      - name: Walking route server (FOSSGIS OSRM foot)
        run: |
          set -euo pipefail
          python3 - <<'PY3'
          import json, math, urllib.request, time
          O = "https://hyeop2da.github.io"
          start = (126.4984, 33.4889)  # 제주도청
          dest = (126.52000128, 33.5115169)  # 우진해장국
          pts = [dest] + [(start[0] + 0.004 * math.cos(i), start[1] + 0.004 * math.sin(i)) for i in range(89)]
          coords = ";".join(f"{x:.5f},{y:.5f}" for x, y in [start] + pts)
          url = "https://routing.openstreetmap.de/routed-foot/table/v1/foot/" + coords + "?sources=0&annotations=distance"
          req = urllib.request.Request(url, headers={"Origin": O, "Referer": O + "/jigeum-yeogi-matjib-03ef4/"})
          for i in range(3):
              try:
                  t = time.time(); r = urllib.request.urlopen(req, timeout=20); break
              except Exception as e:
                  print("재시도", i + 1, e); time.sleep(5)
          else:
              raise SystemExit("::error::도보 경로 서버에 연결하지 못했습니다")
          cors = r.headers.get("Access-Control-Allow-Origin")
          d = json.load(r)
          dist = d["distances"][0]
          def hav(a, b):
              R = 6371000; la1, la2 = math.radians(a[1]), math.radians(b[1])
              h = math.sin((la2 - la1) / 2) ** 2 + math.cos(la1) * math.cos(la2) * math.sin(math.radians(b[0] - a[0]) / 2) ** 2
              return 2 * R * math.asin(math.sqrt(h))
          straight = hav(start, dest)
          ok = sum(1 for v in dist[1:] if v is not None)
          print(f"응답 {time.time()-t:.1f}초 · code={d['code']} · CORS={cors} · 90곳 중 {ok}곳 거리 있음")
          print(f"도청→우진해장국: 직선 {straight:.0f}m, 도보 경로 {dist[1]:.0f}m (x{dist[1]/straight:.2f}), 도보 {dist[1]/67:.0f}분")
          assert d["code"] == "Ok"
          assert cors in ("*", O), "브라우저에서 호출할 수 있게 CORS 허용이 필요합니다"
          assert ok >= 80, "대부분의 지점에 거리가 있어야 합니다"
          assert straight <= dist[1] <= straight * 2.5, "도보 경로 거리가 비정상입니다"
          PY3
