name: Probe lamb (temporary)
on:
  push:
    branches: [gh-pages]
    paths: [".github/workflows/probe-lamb.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.parse
          cfg = open("config.js").read()
          JS = re.search(r"KAKAO_JS_KEY:\s*'([^']+)'", cfg).group(1)
          PROXY = re.search(r"KAKAO_PROXY_URL:\s*'([^']+)'", cfg).group(1)
          O = "https://hyeop2da.github.io"
          sdk = {"Authorization": "KakaoAK " + JS, "KA": "sdk/4.4.19 os/javascript lang/ko-KR device/Win32 origin/" + urllib.parse.quote(O), "Origin": O, "Referer": O + "/", "User-Agent": "Mozilla/5.0"}
          seen = {}
          for q in ["희양양", "양고기", "양갈비", "양꼬치", "램", "양갈비 제주"]:
              d = json.load(urllib.request.urlopen(urllib.request.Request("https://dapi.kakao.com/v2/local/search/keyword.json?" + urllib.parse.urlencode({"query": q, "x": 126.4984, "y": 33.4889, "radius": 20000, "sort": "accuracy", "size": 15}), headers=sdk)))
              for r in d["documents"]:
                  if r["id"] in seen: continue
                  seen[r["id"]] = 1
                  print(q, "|", r["place_name"], "|", r["category_name"], "|", r["distance"], "m")
          # 희양양 메뉴·평점
          d = json.load(urllib.request.urlopen(urllib.request.Request("https://dapi.kakao.com/v2/local/search/keyword.json?" + urllib.parse.urlencode({"query": "희양양", "x": 126.4984, "y": 33.4889, "sort": "accuracy"}), headers=sdk)))["documents"]
          for b in d[:2]:
              q = urllib.parse.urlencode({"id": b["id"], "name": b["place_name"], "addr": b.get("road_address_name") or "", "x": b["x"], "y": b["y"], "v": "probelamb"})
              r = json.load(urllib.request.urlopen(urllib.request.Request(PROXY + "?" + q, headers={"Origin": O})))
              print("DETAIL", b["place_name"], b["category_name"], b["address_name"], "| rating", r.get("rating"), r.get("ratingCount"), "blog", r.get("reviewCount"), "| menu:", r.get("menu"), "| hours:", json.dumps(r.get("hours"), ensure_ascii=False)[:200])
          PY
